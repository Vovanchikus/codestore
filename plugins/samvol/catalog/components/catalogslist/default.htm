{% if catalogs|length %} {# Список активных каталогов #}
<ul class="catalogs-list">
    {% for catalog in catalogs %}
    <li>
        {# Название каталога #}
        <span class="catalogs-list__name">{{ catalog.name }}</span>
        {# Ссылка на страницу каталога #}
        <a
            href="{{ 'catalog/catalog'|page({ catalogCode: catalog.code }) }}"
            class="catalogs-list__link"
            >Перейти</a
        >
    </li>
    {% endfor %}
</ul>
{% else %} {# Заглушка, если каталоги отсутствуют #}
<p>Каталоги отсутствуют.</p>
{% endif %}
