<style>
.sv-help-modal{display:none;position:fixed;inset:0;z-index:1500;align-items:center;justify-content:center}
.sv-help-modal .sv-help-mask{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sv-help-modal .sv-help-dialog{position:relative;z-index:2;background:#fff;padding:18px;border-radius:6px;max-width:820px;width:92%;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.sv-help-modal .sv-help-header{display:flex;justify-content:space-between;align-items:center}
.sv-help-modal .sv-help-body{margin-top:10px;max-height:60vh;overflow:auto}
.sv-help-button{cursor:pointer;margin-left:8px}
.sv-help-pre{background:#f6f8fa;padding:10px;border-radius:4px;font-family:monospace;white-space:pre-wrap}
</style>

<script>
(function(){
    function openModal(id){
        var el = document.getElementById(id);
        if(!el) return;
        el.style.display = 'flex';
        // trap focus if needed (basic)
        var close = el.querySelector('[data-sv-help-close]');
        if(close) close.focus();
    }
    function closeModal(el){
        if(!el) return;
        el.style.display = 'none';
    }
    document.addEventListener('click', function(e){
        var btn = e.target.closest('.sv-help-open');
        if(btn){
            e.preventDefault();
            var target = btn.getAttribute('data-target');
            if(target) openModal(target);
            return;
        }
        var close = e.target.closest('[data-sv-help-close]');
        if(close){
            var modal = close.closest('.sv-help-modal');
            closeModal(modal);
            return;
        }
    });
    // close on ESC
    document.addEventListener('keydown', function(e){
        if(e.key === 'Escape'){
            var open = document.querySelector('.sv-help-modal[style*="display: flex"]');
            if(open) closeModal(open);
        }
    });
})();
</script>
